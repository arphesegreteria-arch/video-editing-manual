name: Bridge CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows bridge tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03/requirements.txt

      - name: Install bridge dependencies
        run: python -m pip install -r requirements.txt
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03

      - name: Diagnose environment-sensitive bridge modules
        continue-on-error: true
        shell: python
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03
        run: |
          import subprocess
          import sys

          modules = (
              "tests.test_artifact_hygiene",
              "tests.test_artifact_records",
              "tests.test_artifact_tools",
              "tests.test_branded_longform_contract",
              "tests.test_carabellese_contract",
              "tests.test_carabellese_transcription",
              "tests.test_colorist_jobs",
          )
          failed = []
          for module in modules:
              print(f"::group::{module}", flush=True)
              try:
                  completed = subprocess.run(
                      [sys.executable, "-m", "unittest", module, "-v"],
                      text=True,
                      capture_output=True,
                      timeout=60,
                  )
              except subprocess.TimeoutExpired as exc:
                  print(exc.stdout or "", flush=True)
                  print(exc.stderr or "", file=sys.stderr, flush=True)
                  failed.append(f"{module}: timeout")
              else:
                  print(completed.stdout, flush=True)
                  print(completed.stderr, file=sys.stderr, flush=True)
                  if completed.returncode:
                      failed.append(f"{module}: exit {completed.returncode}")
              print("::endgroup::", flush=True)
          if failed:
              raise SystemExit("; ".join(failed))

      - name: Locate full-discovery import pollution
        continue-on-error: true
        shell: python
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03
        run: |
          import json
          from pathlib import Path
          import subprocess
          import sys

          modules = [path.stem for path in sorted(Path("tests").glob("test_*.py"))]
          sentinel = (
              "test_artifact_hygiene.ArtifactInventoryTests."
              "test_unregistered_arphe_jpeg_is_report_only"
          )

          probe = r'''
          import importlib
          import json
          from pathlib import Path
          import sys
          import unittest

          modules = json.loads(sys.argv[1])
          sys.path.insert(0, str(Path("tests").resolve()))
          for module in modules:
              importlib.import_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromName(sys.argv[2])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          '''

          def run_prefix(count):
              completed = subprocess.run(
                  [sys.executable, "-c", probe, json.dumps(modules[:count]), sentinel],
                  text=True,
                  capture_output=True,
                  timeout=90,
              )
              print(f"prefix={count}/{len(modules)} exit={completed.returncode}", flush=True)
              if completed.returncode:
                  print(completed.stdout, flush=True)
                  print(completed.stderr, file=sys.stderr, flush=True)
              return completed.returncode == 0

          if run_prefix(len(modules)):
              print("All imports preserve the sentinel; failure requires test execution.")
              raise SystemExit(0)

          low, high = 0, len(modules)
          while high - low > 1:
              middle = (low + high) // 2
              if run_prefix(middle):
                  low = middle
              else:
                  high = middle
          print(f"First failing import prefix ends at: {modules[high - 1]}", flush=True)
          raise SystemExit(1)

      - name: Run creative bridge suite
        run: python -m unittest discover -s tests -v
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03

      - name: Run Windows runtime and profile suite
        run: python -m unittest discover -s scripts/windows_bridge/tests

      - name: Verify closed Colorist and dialogue catalog
        shell: python
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03
        run: |
          from bridge.tool_catalog import EXPOSED_TOOL_NAMES

          expected = {
              "inspect_colorist_context",
              "prepare_colorist_plan",
              "inspect_colorist_plan",
              "approve_colorist_plan",
              "apply_colorist_plan",
              "preview_colorist_version",
              "restore_colorist_preview",
              "submit_colorist_review",
              "start_timeline_dialogue_cleanup_test",
              "get_timeline_dialogue_cleanup_job",
          }
          residual_adv = {
              "create_audio_seam_test",
              "create_caption_test",
              "start_timeline_audio_transcription",
              "get_timeline_audio_transcription_job",
              "inspect_timeline_edit_points",
              "reconcile_legacy_render_batch",
          }

          names = set(EXPOSED_TOOL_NAMES)
          assert len(EXPOSED_TOOL_NAMES) == 113
          assert len(names) == 113
          assert expected <= names
          assert residual_adv.isdisjoint(names)

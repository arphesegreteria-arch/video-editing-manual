name: Bridge CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows bridge tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03/requirements.txt

      - name: Install bridge dependencies
        run: python -m pip install -r requirements.txt
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03

      - name: Run creative bridge suite
        run: python -m unittest discover -s tests -v
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03

      - name: Run Windows runtime and profile suite
        run: python -m unittest discover -s scripts/windows_bridge/tests

      - name: Verify closed Colorist and dialogue catalog
        run: >-
          python -m unittest
          tests.test_safety.SafetyTests.test_colorist_and_dialogue_catalog_is_closed
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03

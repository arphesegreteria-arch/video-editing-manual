name: Bridge CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows bridge tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03/requirements.txt

      - name: Install bridge dependencies
        run: python -m pip install -r requirements.txt
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03

      - name: Diagnose environment-sensitive bridge modules
        continue-on-error: true
        shell: python
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03
        run: |
          import subprocess
          import sys

          modules = (
              "tests.test_artifact_hygiene",
              "tests.test_artifact_records",
              "tests.test_artifact_tools",
              "tests.test_branded_longform_contract",
              "tests.test_carabellese_contract",
              "tests.test_carabellese_transcription",
              "tests.test_colorist_jobs",
          )
          failed = []
          for module in modules:
              print(f"::group::{module}", flush=True)
              try:
                  completed = subprocess.run(
                      [sys.executable, "-m", "unittest", module, "-v"],
                      text=True,
                      capture_output=True,
                      timeout=60,
                  )
              except subprocess.TimeoutExpired as exc:
                  print(exc.stdout or "", flush=True)
                  print(exc.stderr or "", file=sys.stderr, flush=True)
                  failed.append(f"{module}: timeout")
              else:
                  print(completed.stdout, flush=True)
                  print(completed.stderr, file=sys.stderr, flush=True)
                  if completed.returncode:
                      failed.append(f"{module}: exit {completed.returncode}")
              print("::endgroup::", flush=True)
          if failed:
              raise SystemExit("; ".join(failed))

      - name: Run creative bridge suite
        run: python -m unittest discover -s tests -v
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03

      - name: Run Windows runtime and profile suite
        run: python -m unittest discover -s scripts/windows_bridge/tests

      - name: Verify closed Colorist and dialogue catalog
        shell: python
        working-directory: scripts/experiments/ARPHE_MCP_BRIDGE_CREATIVE_03
        run: |
          from bridge.tool_catalog import EXPOSED_TOOL_NAMES

          expected = {
              "inspect_colorist_context",
              "prepare_colorist_plan",
              "inspect_colorist_plan",
              "approve_colorist_plan",
              "apply_colorist_plan",
              "preview_colorist_version",
              "restore_colorist_preview",
              "submit_colorist_review",
              "start_timeline_dialogue_cleanup_test",
              "get_timeline_dialogue_cleanup_job",
          }
          residual_adv = {
              "create_audio_seam_test",
              "create_caption_test",
              "start_timeline_audio_transcription",
              "get_timeline_audio_transcription_job",
              "inspect_timeline_edit_points",
              "reconcile_legacy_render_batch",
          }

          names = set(EXPOSED_TOOL_NAMES)
          assert len(EXPOSED_TOOL_NAMES) == 113
          assert len(names) == 113
          assert expected <= names
          assert residual_adv.isdisjoint(names)
